distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Official URL, kept for reference:
#   https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# That host is frequently rate-limited/slow from mainland China (the default 10s
# wrapper timeout gives up mid-transfer). The Tencent mirror below serves the
# byte-identical archive and is fast here. Swap it back if building outside China.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip

# Generous timeout: a ~145 MB download over a slow international link can stall
# longer than Gradle's 10s default and the wrapper aborts the whole build.
networkTimeout=120000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
